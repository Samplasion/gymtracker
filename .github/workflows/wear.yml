name: Wear OS checks
on:
  pull_request:
    paths: ['android/**', 'lib/service/**', 'lib/model/wearable_training.dart', 'test/service/**', '.github/workflows/wear.yml']
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - uses: android-actions/setup-android@v3
      - run: flutter pub get
      - name: Initialize Flutter Android configuration
        run: |
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
      - name: Verify Wear OS
        working-directory: android
        run: ./gradlew :wearable-core:testDebugUnitTest :wear:testDebugUnitTest :wear:lintDebug :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GymBro-Wear-debug
          path: build/wear/outputs/apk/debug/wear-debug.apk
